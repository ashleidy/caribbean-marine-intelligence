


name: Caribbean Marine Intelligence - Endpoint Check

on:
  schedule:
    - cron: "23 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Streamlit HTTP Check
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check Streamlit endpoint
        shell: bash
        run: |
          set -u

          URL="https://caribbean-marine-intelligence.streamlit.app/"
          HEADERS=$(mktemp)
          BODY=$(mktemp)

          echo "Checking Caribbean Marine Intelligence..."

          set +e
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --max-time 60 \
            --dump-header "$HEADERS" \
            --output "$BODY" \
            --write-out "%{http_code}" \
            "$URL")
          CURL_EXIT=$?
          set -e

          echo "HTTP status: $HTTP_STATUS"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Connection failed. Curl exit: $CURL_EXIT"
            rm -f "$HEADERS" "$BODY"
            exit 1
          fi

          if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "SUCCESS: HTTP endpoint returned $HTTP_STATUS."

          elif [[ "$HTTP_STATUS" =~ ^3[0-9][0-9]$ ]]; then
            LOCATION=$(grep -i "^location:" "$HEADERS" | tail -n 1 | tr -d '\r')

            echo "::notice::Streamlit returned a redirect: $HTTP_STATUS"
            echo "Redirect destination: $LOCATION"
            echo "This can be normal for non-browser clients."
            echo "Application rendering has not been verified."

          else
            echo "::error::Unexpected HTTP status: $HTTP_STATUS"
            rm -f "$HEADERS" "$BODY"
            exit 1
          fi

          rm -f "$HEADERS" "$BODY"


