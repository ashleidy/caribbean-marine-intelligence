

name: Caribbean Marine Intelligence - Keep Alive

on:
  schedule:
    - cron: "23 */6 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    name: Streamlit Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check application availability
        shell: bash
        run: |
          set -u

          URL="https://caribbean-marine-intelligence.streamlit.app/"
          RESPONSE_FILE=$(mktemp)

          echo "Checking Caribbean Marine Intelligence..."

          set +e
          HTTP_STATUS=$(curl \
            --location \
            --silent \
            --show-error \
            --max-time 120 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            "$URL")
          CURL_EXIT=$?
          set -e

          echo "HTTP status: $HTTP_STATUS"

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "ERROR: Request failed."
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          if grep -Eqi "This app has gone to sleep|Yes, get this app back up|Zzzz" "$RESPONSE_FILE"; then
            echo "WARNING: Streamlit application is sleeping."
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          if ! [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
            echo "ERROR: Unexpected HTTP response."
            rm -f "$RESPONSE_FILE"
            exit 1
          fi

          echo "SUCCESS: Application responded with HTTP $HTTP_STATUS."

          rm -f "$RESPONSE_FILE"

